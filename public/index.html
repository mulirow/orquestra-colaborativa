<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orquestra Colaborativa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA DE LOBBY -->
    <div id="landing-screen">
        <h1>Orquestra Colaborativa</h1>
        <div class="lobby-box">
            <p>Crie uma nova sala ou entre em uma existente:</p>
            <input type="text" id="roomInput" placeholder="Nome da Sala (ex: jam-session)" autocomplete="off">
            <button id="joinBtn" class="btn-play">ENTRAR NA SALA</button>
        </div>
    </div>

    <!-- TELA DA APLICAÇÃO -->
    <div id="app-screen" style="display: none;">

        <div class="header-bar">
            <div>
                <h1 style="margin:0; font-size: 1.2rem;">Orquestra Colaborativa</h1>
                <div id="roomNameDisplay" style="font-size: 0.8rem; color: #888;">Sala: ---</div>
            </div>
            <div id="statusText">AGUARDANDO INÍCIO...</div>
        </div>

        <div class="pagination-bar">
            <!-- Bar 1 -->
            <div class="page-control active" id="page-ctrl-0">
                <span class="view-tap" onclick="changePage(0)">BAR 1</span>
                <span class="toggle-tap" onclick="toggleBar(0, event)">🔊</span>
            </div>
            <!-- Bar 2 -->
            <div class="page-control" id="page-ctrl-1">
                <span class="view-tap" onclick="changePage(1)">BAR 2</span>
                <span class="toggle-tap" onclick="toggleBar(1, event)">🔊</span>
            </div>
            <!-- Bar 3 -->
            <div class="page-control" id="page-ctrl-2">
                <span class="view-tap" onclick="changePage(2)">BAR 3</span>
                <span class="toggle-tap" onclick="toggleBar(2, event)">🔊</span>
            </div>
            <!-- Bar 4 -->
            <div class="page-control" id="page-ctrl-3">
                <span class="view-tap" onclick="changePage(3)">BAR 4</span>
                <span class="toggle-tap" onclick="toggleBar(3, event)">🔊</span>
            </div>
        </div>

        <div id="sequencer-container"></div>

        <div id="controls">
            <!-- Play / Pause & Instruments -->
            <div class="control-section">
                <button id="audioToggleBtn" class="btn-play">INICIAR ÁUDIO 🔊</button>

                <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 5px;">
                    <label for="instrumentSelect" style="font-size: 0.8rem; color: #ddd;">Instrumento:</label>
                    <select id="instrumentSelect" style="padding: 5px; border-radius: 5px;">
                        <option value="Synth">Sintetizador (Padrão)</option>
                        <option value="Piano">Piano</option>
                        <option value="Guitar">Violão</option>
                        <option value="ElectricGuitar">Guitarra Elétrica</option>
                        <option value="Saxophone">Saxofone</option>
                    </select>
                </div>

                <div style="font-size: 0.8rem; color: #888; margin-top: 10px;">BPM: 120</div>
            </div>

            <!-- Time Machine -->
            <div class="control-section">
                <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.9rem; font-weight: bold; color: #ddd;">Time Machine</span>
                        <span id="replayCounter" style="font-size: 0.7rem; color: #666;">Histórico: 0 estados</span>
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button id="linearReplayBtn" disabled>Histórico Visual ⏩</button>

                        <div class="slider-container">
                            <span>Lento</span>
                            <input type="range" id="speedRange" min="1" max="20" value="10">
                            <span>Rápido</span>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
                        <button id="cyclicReplayBtn" disabled>Timelapse 🎵</button>
                    </div>

                    <div id="replayBar">
                        <div id="replayProgress"></div>
                    </div>
                </div>
            </div>

            <!-- Import/Export State -->
            <div class="control-section">
                <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.9rem; font-weight: bold; color: #ddd;">Salvar / Carregar</span>
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button id="exportBtn" style="flex: 1;">EXPORTAR ESTADO 💾</button>
                        <button id="importBtn" style="flex: 1;">IMPORTAR ESTADO 📂</button>
                        <input type="file" id="importFileInput" accept=".json" style="display: none;">
                    </div>

                    <div style="font-size: 0.7rem; color: #666; text-align: center;">
                        Exporte para salvar ou importe para restaurar um estado anterior
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="script.js"></script>

</body>

</html>
